name: Release

# Triggered by pushing a version tag (vX.Y.Z). Gitea mirrors the tag to GitHub,
# where this workflow calls the shared release pipeline: guards, `npm run check`,
# README release-notes sync, npm publish (with provenance), tarball and GitHub
# release. Publishing happens here and only here; tags are never created here
# (Gitea is the source of truth for refs and mirrors them to GitHub).
on:
  push:
    tags:
      - 'v*.*.*'

# Required by the called workflow: create the GitHub release and mint the OIDC
# token for npm trusted publishing. No npm secret is passed: npm authorises this
# workflow file through the Trusted Publisher set on npmjs.com for this package.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: __OWNER__/__TOOLKIT_REPO__/.github/workflows/reusable-release.yml@__TOOLKIT_REF__